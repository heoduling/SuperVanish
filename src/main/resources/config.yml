# SuperVanish 中文配置
# 修改后用 /sv reload 重载；true 启用，false 关闭。键名和命令参数保持英文。
# 用空格缩进，不要用 Tab。


# 隐身功能
InvisibilityFeatures:
  # 给予夜视，显形时恢复原有未过期的效果。
  NightVisionEffect: true
  # 免疫伤害。
  DisableDamage: true
  # 不消耗饥饿值。
  DisableHunger: true
  # 阻止生物将隐身者作为攻击目标。
  DisableMobTarget: true
  # 静默开箱，需要 sv.silentchest 权限；会临时切换为旁观模式，仅建议授予可信管理员。
  OpenChestsSilently: true
  # 不触发压力板和绊线。
  DisablePressurePlates: true
  # 禁止玩家碰撞推挤；本适配使用玩家碰撞标志，不创建计分板队伍。
  DisablePush: false
  # 默认是否捡拾物品；用 /sv tipu 单独切换。
  DefaultPickUpItemsOption: false
  # 使用可选 PacketEvents 过滤现代玩家列表数据包；基础隐身不依赖数据包插件。
  ModifyTablistPackets: true
  # 使用可选 PacketEvents 过滤命令补全中的隐身玩家姓名。
  ModifyTabCompletePackets: true
  # 不触发幽匿感测体。
  PreventSculkSensorActivation: true
  # 不踩碎海龟蛋。
  PreventTurtleEggBreaking: true
  # 不使大型垂滴叶倾斜。
  DisableDripLeaf: true
  # 不触发袭击。
  PreventRaidTriggering: true
  # 不作为自然生物生成的玩家条件。
  PreventMobSpawning: true
  # 飞行设置
  Fly:
    # 允许隐身玩家在生存等模式下飞行。
    Enable: true
    # 显形时取消飞行能力；拥有 sv.keepfly 权限者除外。
    DisableOnReappear: true

# 自动切换隐身状态
VanishStateFeatures:
  # 拥有 sv.joinvanished 权限者每次进服自动隐身。
  AutoVanishOnJoin: false
  # 切换世界时自动显形。
  ReappearOnWorldChange: false
  # 退出服务器时清除已保存的隐身状态。
  ReappearOnQuit: false
  # 切换世界后没有 sv.use 权限则自动显形。
  CheckPermissionOnWorldChange: false
  # 退出时没有 sv.use 权限则清除隐身状态。
  CheckPermissionOnQuit: false
  # 进服时没有 sv.use 权限则清除隐身状态。
  CheckPermissionOnLogin: false

# 管理员可见性和提示
IndicationFeatures:
  # 分级可见权限
  LayeredPermissions:
    # 拥有 sv.see 权限者可看见隐身玩家。
    EnableSeePermission: true
    # 启用 sv.use.levelX 与 sv.see.levelX；see 等级不低于目标 use 等级时可见。在线改权限后需重新进服。
    LayeredSeeAndUsePermissions: false
    # 分级权限最高等级；数值越大，检查次数可能越多。
    MaxLevel: 100
  # 向有权看见隐身者的管理员显示旁观者样式，需要 PacketEvents；已验证 Minecraft 26.2。
  MarkVanishedPlayersAsSpectators: true

# 消息开关；文案在 messages.yml 修改
MessageOptions:
  # 假进退服消息
  FakeJoinQuitMessages:
    # 隐身时广播假退出消息或管理员通知。
    BroadcastFakeQuitOnVanish: true
    # 显形时广播假加入消息或管理员通知。
    BroadcastFakeJoinOnReappear: true
    # 拥有 sv.see 权限者收到管理员通知。
    AnnounceVanishReappearToAdmins: true
    # 只发送管理员通知。
    SendMessageOnlyToAdmins: false
    # 只发送普通玩家的假进退服消息。
    SendMessageOnlyToUsers: false
  # 隐藏隐身者真实进退服的公开消息。
  HideRealJoinQuitMessages: true
  # 隐身者的进度消息仅发给本人。
  HideAdvancementMessages: true
  # 退出时显形仍隐藏真实退出消息；优先于 HideRealJoinQuitMessages。
  ReappearOnQuitHideLeaveMsg: true
  # 向拥有 sv.see 权限者通知隐身玩家真实进退服。
  AnnounceRealJoinQuitToAdmins: true
  # 向拥有 sv.see 权限者通知隐身玩家死亡。
  AnnounceDeathToAdmins: true
  # 进服时提醒玩家仍处于隐身状态。
  RemindVanishedOnJoin: true
  # 在动作栏持续提示隐身状态。
  DisplayActionBar: true

# 隐身操作限制
RestrictiveOptions:
  # 禁止破坏方块；sv.breakblocks 可绕过。
  PreventBlockBreaking: false
  # 禁止放置方块；sv.placeblocks 可绕过。
  PreventBlockPlacing: false
  # 禁止伤害玩家或生物；sv.damage 可绕过。
  PreventHittingEntities: false

# 服务器列表中的隐身处理
ExternalInvisibility:
  # 服务器列表显示
  ServerList:
    # 在线人数扣除隐身玩家。
    AdjustAmountOfOnlinePlayers: true
    # 从悬停在线人数时显示的玩家列表中移除隐身者。
    AdjustListOfLoggedInPlayers: true

# 可选插件联动；安装对应插件后才生效
HookOptions:
  # 在 Essentials 的 /who、/list、/online、/near 中隐藏玩家；essentials.vanish.interact 可查看。修改后先重载 SV 再重载 Essentials。
  EnableEssentialsHook: true
  # 在 Dynmap 地图中隐藏隐身者。
  EnableDynmapHook: true
  # 在 Dynmap 网页聊天中发送假进退服消息。
  DynmapSendJoinLeaveMessages: true
  # 隐身时关闭 TrailGUI 拖尾。
  EnableTrailGUIHook: true
  # 接入 PlaceholderAPI；支持 %supervanish_isvanished%、%supervanish_vanishedplayers%、%supervanish_playercount%。
  EnablePlaceholderAPIHook: true
  # 接入 MVdWPlaceholderAPI；格式为 {supervanish_isvanished} 等。
  EnableMVdWPlaceholderAPIHook: true
  # 阻止 Citizens NPC 向隐身玩家问候或谈论他们。
  EnableCitizensHook: true
  # 安装 OpenInv 后优先使用其静默开箱能力。
  EnableOpenInvHook: true

# 高级兼容设置；可用 LOWEST、LOW、NORMAL、HIGH、HIGHEST、MONITOR，修改后需验证事件顺序。
CompatibilityOptions:
  # 隐藏进服消息的优先级；使用 Essentials 修改进退服消息时保持 HIGH。
  PlayerJoinEventPriority: HIGH
  # 隐藏退服消息的优先级。
  PlayerQuitEventPriority: HIGH

# 自动维护的版本，请勿修改。
ConfigVersion: ${project.version}
