name: SuperVanish
main: de.myzelyam.supervanish.SuperVanish
author: MyzelYam
description: 支持 Folia 和受控热加载的玩家隐身插件
version: ${project.version}
api-version: 1.13
folia-supported: true
website: https://www.spigotmc.org/resources/supervanish-be-invisible.1331/
softdepend:
- PlugManX
- packetevents
- LibsDisguises
- DisguiseCraft
- dynmap
- Essentials
- TrailGUI
- PlaceholderAPI
- CustomParticleEffects
- NametagEdit
- MVdWPlaceholderAPI
- Vault
- OpenInv
commands:
  sv:
    usage: /sv
    description: SuperVanish 隐身指令，使用 /sv help 查看中文帮助
    aliases: [supervanish, v, vanish]
permissions:
  sv.*:
    children:
      sv.use: true
      sv.see: true
      sv.reload: true
      sv.logout: true
      sv.login: true
      sv.others: true
      sv.list: true
      sv.keepfly: true
      sv.toggleitems: true
      sv.recreatefiles: true
      sv.notoggle: true
      sv.joinvanished: true
      sv.breakblocks: true
      sv.placeblocks: true
      sv.damage: true
      sv.stacktrace: true
      sv.silentchest: true
    description: 授予全部 SuperVanish 权限
  supervanish.*:
    children:
      sv.*: true
    description: 授予全部 SuperVanish 权限
  sv.see:
    description: 允许看见其他隐身玩家
  sv.notoggle:
    description: 在线时阻止其他玩家更改你的隐身状态
  sv.keepfly:
    description: 显形后保留飞行能力
  sv.joinvanished:
    description: 进服自动隐身（需开启配置）
  sv.silentchest:
    description: 允许静默开箱
