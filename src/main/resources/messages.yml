# SuperVanish 中文消息
# <参数> 必填，[参数] 可选，| 二选一；命令英文参数保持原样。
# & 用于颜色代码，如 &c红色；#663EF6 用于十六进制颜色。
# %p% 玩家名；%other% 目标或操作者；%d% 显示名；%tab% TAB 列表名。
# %prefix%、%suffix%、%group% 需要 Vault；%nick% 需要 Essentials。
# 支持已启用的 PlaceholderAPI / MVdWPlaceholderAPI 占位符。
# 空消息不发送；双引号字符串中用 \n 换行。
# 单引号字符串内的单引号写两次；缩进只用空格。
# 升级时只替换匹配旧默认值的消息，保留自定义消息。
# PlaceholderIsVanishedYes/No 保持 Yes/No，兼容其他插件的条件判断。
Messages:
  NoPermission: '&4你没有权限执行此操作。'
  InvalidUsage: '&c用法不正确，请使用 &6/sv help &c查看指令帮助。'
  VanishMessage: '&e%p% 退出了游戏'
  ReappearMessage: '&e%p% 加入了游戏'
  VanishMessageWithPermission: '&a[SV] %p% 已隐身。'
