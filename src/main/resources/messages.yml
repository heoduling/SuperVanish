  CannotHideOtherPlayer: '&c你没有权限更改 %other% 的可见状态。'
  AlreadyInvisibleMessage: '&c玩家 &e%other% &c已经隐身。'
  AlreadyVisibleMessage: '&c玩家 &e%other% &c当前没有隐身。'
  PluginReloaded: '&aSuperVanish 已完成重载（%time% 毫秒）。'
  InvalidSender: '&c此指令只能由游戏内玩家执行。'
