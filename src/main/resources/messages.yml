  OnReappearCausedByOtherPlayer: '&a%other% 已将你设为可见。'
  AlreadyVanishedError: '&c你已经处于隐身状态。'
  NotVanishedError: '&c你当前没有隐身。'
  SilentJoinMessageForAdmins: '&a[SV] %p% 已隐身进服。'
  SilentQuitMessageForAdmins: '&a[SV] %p% 已隐身退服。'
  SilentDeathMessage: '&a[SV] %deathmsg%'
  RemindingMessage: '&a你仍处于隐身状态！'
  ListMessagePrefix: '&a隐身玩家：&f %l'
  ActionBarMessage: '&a你已对其他玩家隐身！'
  HideOtherMessage: '&a玩家 &e%other% &a已隐身。'
